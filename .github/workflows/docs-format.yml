name: Docs Format

# The Markdown gate for docs-only changes.
#
# `npm run format:check` is `prettier --check .`, which covers Markdown, and
# `ci.yml` runs it on every PR and push to main (via `quality.yml`). This
# workflow stays as the fast, path-filtered Markdown check: it reports on a
# docs-only PR within seconds, without `npm ci` or a build.
#
# Deliberately narrow: Markdown only, no `npm ci`, no build.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '**.md'
  push:
    branches: [main]
    paths:
      - '**.md'

# Cancel only a superseded PR run. A push to main gets a group of its own (its
# sha), like in ci.yml: a shared group keeps one pending run at most, so a third
# push would cancel the queued second.
concurrency:
  group: docs-format-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: this job only checks out the repository and runs Prettier.
permissions:
  contents: read

jobs:
  format:
    name: Prettier (Markdown)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Nothing here talks to the git remote, and `npx --yes` runs a
          # downloaded package: keep the job token out of the git config.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'

      # Read the pinned version out of package.json rather than hardcoding it,
      # so this job can never drift from the Prettier `npm run format` applies.
      # `.prettierignore` still applies, so the `.claude/` exclusion holds.
      # The value is narrowed to a semver: on a PR `package.json` is the PR's
      # content, and an unconstrained string would let it pick any package
      # spec for `npx`. An empty match fails the job instead of running an
      # unpinned Prettier.
      - name: Resolve pinned Prettier version
        id: prettier
        run: |
          version=$(node -p "(/[0-9][0-9A-Za-z.+-]*/.exec(require('./package.json').devDependencies.prettier)||[''])[0]")
          if [ -z "${version}" ]; then
            echo "::error::No semver Prettier version in package.json devDependencies"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # Markdown only: the wider docs tree holds files Prettier has no parser
      # for (`.mmd` and friends), which would fail the run outright.
      #
      # The resolved version reaches the shell through `env`, never through an
      # inline `${{ }}` in `run`: an inline expression is substituted into the
      # script before the shell parses it, and on a PR `package.json` is the
      # PR's content. As an env var the shell only ever treats it as data.
      - name: Check Markdown formatting
        run: npx --yes "prettier@${PRETTIER_VERSION}" --check "**/*.md"
        env:
          PRETTIER_VERSION: ${{ steps.prettier.outputs.version }}
