name: CI

# The code gate for pull requests and main. The chain itself lives in the
# reusable `quality.yml`, which `docker-publish.yml` calls as well, so a PR is
# checked by exactly the steps that gate the image push.

on:
  push:
    branches: [main]
  pull_request:

# A PR run is superseded by the PR's next push, so it may be cancelled. A push
# run on main is not: each push gets a group of its own (its sha), so a newer
# push can neither cancel nor replace a pending one.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: verification only needs to read the checkout.
permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/quality.yml
