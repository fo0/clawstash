name: Quality Checks

# The code chain, shared by `ci.yml` (pull requests + pushes to main) and
# `docker-publish.yml` (gate before the image push). One definition, so the PR
# gate and the publish gate can never drift apart. Order follows CLAUDE.md ->
# Commands: typecheck before lint, test before build.

on:
  workflow_call:

# Least privilege: verification only needs to read the checkout.
permissions:
  contents: read

jobs:
  check:
    name: Format, typecheck, lint, test and build
    runs-on: ubuntu-latest
    # GitHub's default job timeout is 6 hours. A hung install/build (network
    # stall, a test waiting on stdin) would sit there burning runner minutes;
    # the chain itself takes ~2 minutes.
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # `npm ci` runs dependency lifecycle scripts: keep the job token out
          # of the git config.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Format Check
        run: npm run format:check

      - name: Run Type Check
        run: npx tsc --noEmit

      - name: Run Linter
        run: npm run lint

      - name: Run Tests
        run: npm test

      - name: Build Frontend
        run: npm run build
