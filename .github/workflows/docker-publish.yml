name: Docker Publish

on:
  workflow_dispatch:

# Workflow-level default = least privilege. Only `build-and-push` needs to
# write packages, and it declares that itself in its own `permissions:` block
# below; granting `packages: write` here would hand the same GHCR push token
# to `check-code`, which merely lints, tests and builds.
permissions:
  contents: read

# Two dispatches must not push the image in parallel: the second one waits for
# the first instead of racing it for the `latest` tag (GitHub keeps at most one
# pending run per group). Never cancel a run in progress -- a half-pushed image
# is worse than a late one.
concurrency:
  group: docker-publish
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # 1. Code Quality Check -- the same reusable chain `ci.yml` runs on PRs.
  check-code:
    uses: ./.github/workflows/quality.yml

  # 2. Build and Push Docker Image
  build-and-push:
    needs: check-code
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # No later step uses git with the job token: the GHCR login passes
          # its own token and the build reads a path context (`context: .`).
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_COMMIT_SHA=${{ github.sha }}
            BUILD_BRANCH=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
