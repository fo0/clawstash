name: Build and Push Docker image to GHCR

on:
  workflow_dispatch:

# Workflow-level default = least privilege. Only `build-and-push` needs to
# write packages, and it declares that itself in its own `permissions:` block
# below; granting `packages: write` here would hand the same GHCR push token
# to `check-code`, which merely lints, tests and builds.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # 1. Code Quality Check
  check-code:
    runs-on: ubuntu-latest
    # GitHub's default job timeout is 6 hours. A hung install/build (network
    # stall, a test waiting on stdin) would sit there burning runner minutes
    # and holding the dispatch open. `docs-format.yml` already caps itself;
    # these two jobs were the drift.
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Format Check
        run: npm run format:check

      - name: Run Type Check
        run: npx tsc --noEmit

      # `npm run` prints script names UNQUOTED, so the previous
      # `grep -q '"lint"'` / `grep -q '"test"'` guards never matched and both
      # steps silently no-op'd — the image was published without ever running
      # the test suite. Probe package.json directly instead.
      - name: Run Linter
        run: |
          if node -e "process.exit(require('./package.json').scripts?.lint ? 0 : 1)"; then
            npm run lint
          else
            echo "No lint script defined - skipping."
          fi

      - name: Run Tests
        run: npm run test:run

      - name: Build Frontend
        run: npm run build

  # 2. Build and Push Docker Image
  build-and-push:
    needs: check-code
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_COMMIT_SHA=${{ github.sha }}
            BUILD_BRANCH=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
